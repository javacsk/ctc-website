<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you | CTC Limited</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#2b2d30;min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.6}
  .box{background:#fff;border:1px solid #e3e8ef;border-radius:18px;padding:48px 36px;max-width:520px;width:100%;text-align:center}
  img{height:52px;width:auto;margin:0 auto 32px;display:block}
  .tick{width:64px;height:64px;border-radius:50%;background:rgba(0,174,239,.12);color:#0088c4;display:grid;place-items:center;margin:0 auto 20px}
  .tick svg{width:32px;height:32px}
  h1{font-size:28px;font-weight:800;margin-bottom:10px}
  p{color:#5b6675;margin-bottom:28px}
  a.btn{display:inline-block;background:#00aeef;color:#fff;text-decoration:none;font-weight:600;padding:13px 26px;border-radius:10px}
  a.btn:hover{background:#0088c4}
</style>
</head>
<body>
  <div class="box">
    <img src="assets/logo.png" alt="CTC Limited">
    <div class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg></div>
    <h1>Thank you!</h1>
    <p>Your message has been sent to our team. We'll get back to you soon.</p>
    <a class="btn" href="/">Back to home</a>
  </div>
</body>
</html>
